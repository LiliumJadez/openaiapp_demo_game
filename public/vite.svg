<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="seaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00374d"/>
      <stop offset="100%" style="stop-color:#00141a"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#seaGradient)" stroke="#00a0e6" stroke-width="2"/>
  <path d="M25 50 Q35 40, 50 50 T75 50" stroke="#00a0e6" stroke-width="2" fill="none" opacity="0.5">
    <animate attributeName="d" values="M25 50 Q35 40, 50 50 T75 50;M25 50 Q35 60, 50 50 T75 50;M25 50 Q35 40, 50 50 T75 50" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M25 55 Q35 45, 50 55 T75 55" stroke="#00a0e6" stroke-width="1.5" fill="none" opacity="0.3">
    <animate attributeName="d" values="M25 55 Q35 45, 50 55 T75 55;M25 55 Q35 65, 50 55 T75 55;M25 55 Q35 45, 50 55 T75 55" dur="2.5s" repeatCount="indefinite"/>
  </path>
  <line x1="50" y1="25" x2="50" y2="45" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="50" cy="48" r="3" fill="#ef4444">
    <animate attributeName="cy" values="48;52;48" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="50" y="75" text-anchor="middle" fill="#b3e7ff" font-size="8" font-family="serif">虚数海筏</text>
</svg>

